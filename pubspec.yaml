name: aqutter_core
description: Aqutter 框架的 Flutter WebView 核心套件：inline WebView、headless WebView 與 in-app browser（源自 flutter_inappwebview）。
version: 0.2.0
publish_to: none
homepage: https://github.com/Aqutter/aqutter_core
repository: https://github.com/Aqutter/aqutter_core
issue_tracker: https://github.com/Aqutter/aqutter_core/issues

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  aqutter_core_internal_annotations:
    path: dev_packages/aqutter_core_internal_annotations
  plugin_platform_interface: ^2.1.8
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  generators:
    path: dev_packages/generators

flutter:
  plugin:
    platforms:
      android:
        package: com.github.aqutter.core
        pluginClass: AqutterCorePlugin
        dartPluginClass: AqutterAndroidWebViewPlatform
      ios:
        pluginClass: AqutterCorePlugin
        dartPluginClass: AqutterIOSWebViewPlatform
      macos:
        pluginClass: AqutterCorePlugin
        dartPluginClass: AqutterMacOSWebViewPlatform
      windows:
        pluginClass: AqutterCorePluginCApi
        dartPluginClass: AqutterWindowsWebViewPlatform
      linux:
        pluginClass: AqutterCorePlugin
        dartPluginClass: AqutterLinuxWebViewPlatform
      web:
        pluginClass: AqutterCorePlugin
        fileName: src/platforms/web/web/main.dart
  assets:
    - packages/aqutter_core/assets/t_rex_runner/t-rex.html
    - packages/aqutter_core/assets/t_rex_runner/t-rex.css
    - packages/aqutter_core/assets/web/web_support.js

false_secrets:
  - /test_node_server/*.pem
  - /test_node_server/*.pfx
